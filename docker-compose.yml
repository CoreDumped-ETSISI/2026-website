services:
  main-website:
    build: .
    image: main-website:latest
    container_name: main-website
    hostname: coredumped.etsisi.upm.es
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - TZ=Europe/Madrid
      - REPO_URL=https://github.com/CoreDumped-ETSISI/2026-website.git
      - CRON_SCHEDULE=59 23 * * *
    networks:
      - server-network

networks:
  server-network:
    external: true
